<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Brishti Gorai animated developer avatar</title>
  <desc id="d">A friendly developer with glasses typing on a glowing laptop, surrounded by floating tech badges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="400" rx="28"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'Fira Code','SFMono-Regular',Consolas,monospace;font-weight:600}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fl{animation:float 4s ease-in-out infinite}
    .d1{animation-delay:-1s}.d2{animation-delay:-2s}.d3{animation-delay:-3s}
    .bob{animation:bob 3.2s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .hand{animation:tap .45s ease-in-out infinite}
    .hand2{animation:tap .45s ease-in-out infinite;animation-delay:-.22s}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#card)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <circle cx="200" cy="215" r="170" fill="url(#glow)" class="pulse"/>

    <!-- rotating dashed ring -->
    <circle class="ring" cx="200" cy="215" r="150" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 10"/>

    <!-- sparkles -->
    <g fill="#A78BFA">
      <circle class="tw" cx="60" cy="60" r="3"/>
      <circle class="tw" cx="345" cy="55" r="2.5" style="animation-delay:-1s"/>
      <circle class="tw" cx="30" cy="250" r="2.5" style="animation-delay:-2s"/>
      <circle class="tw" cx="372" cy="300" r="3" style="animation-delay:-.5s"/>
    </g>

    <!-- status pill -->
    <g>
      <rect x="112" y="22" width="176" height="30" rx="15" fill="#0D1117" stroke="#22D3EE" stroke-opacity=".5"/>
      <circle class="pulse" cx="134" cy="37" r="5" fill="#34D399"/>
      <text class="mono" x="148" y="41" font-size="12" fill="#E5E7EB">open to build</text>
    </g>

    <!-- floating tech badges -->
    <g class="fl">
      <rect x="28" y="110" width="62" height="34" rx="10" fill="#0D1117" stroke="#22D3EE"/>
      <text class="mono" x="59" y="132" font-size="15" fill="#22D3EE" text-anchor="middle">&lt;/&gt;</text>
    </g>
    <g class="fl d1">
      <rect x="308" y="95" width="62" height="34" rx="10" fill="#0D1117" stroke="#A78BFA"/>
      <text class="mono" x="339" y="117" font-size="15" fill="#A78BFA" text-anchor="middle">{ }</text>
    </g>
    <g class="fl d2">
      <rect x="22" y="200" width="62" height="34" rx="10" fill="#0D1117" stroke="#34D399"/>
      <text class="mono" x="53" y="222" font-size="14" fill="#34D399" text-anchor="middle">Py</text>
    </g>
    <g class="fl d3">
      <rect x="314" y="190" width="62" height="34" rx="10" fill="#0D1117" stroke="#F472B6"/>
      <text class="mono" x="345" y="212" font-size="14" fill="#F472B6" text-anchor="middle">SQL</text>
    </g>
    <g class="fl d1">
      <rect x="30" y="285" width="62" height="34" rx="10" fill="#0D1117" stroke="#38BDF8"/>
      <text class="mono" x="61" y="307" font-size="14" fill="#38BDF8" text-anchor="middle">API</text>
    </g>

    <!-- character -->
    <g class="bob">
      <!-- back hair -->
      <path d="M128 215 C122 140 168 120 200 120 C232 120 278 140 272 215 C274 262 262 290 246 296 L154 296 C138 290 126 262 128 215 Z" fill="#1F1235"/>
      <!-- neck -->
      <rect x="184" y="262" width="32" height="44" rx="12" fill="#E3A982"/>
      <!-- hoodie -->
      <path d="M96 400 C96 335 140 300 200 300 C260 300 304 335 304 400 Z" fill="url(#hoodie)"/>
      <path d="M170 300 C178 322 222 322 230 300" fill="none" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
      <line x1="188" y1="318" x2="186" y2="345" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
      <line x1="212" y1="318" x2="214" y2="345" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
      <!-- head -->
      <ellipse cx="200" cy="222" rx="58" ry="64" fill="#F1C3A0"/>
      <ellipse cx="144" cy="228" rx="8" ry="12" fill="#E3A982"/>
      <ellipse cx="256" cy="228" rx="8" ry="12" fill="#E3A982"/>
      <!-- fringe -->
      <path d="M140 214 C138 150 262 150 260 214 C246 188 214 178 194 172 C176 192 158 204 140 214 Z" fill="#1F1235"/>
      <!-- cheeks -->
      <circle cx="165" cy="248" r="8" fill="#F472B6" opacity=".3"/>
      <circle cx="235" cy="248" r="8" fill="#F472B6" opacity=".3"/>
      <!-- eyes -->
      <ellipse class="eye" cx="178" cy="228" rx="5" ry="6.5" fill="#111827"/>
      <ellipse class="eye" cx="222" cy="228" rx="5" ry="6.5" fill="#111827"/>
      <!-- glasses -->
      <g fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-width="3">
        <circle cx="178" cy="228" r="19"/>
        <circle cx="222" cy="228" r="19"/>
      </g>
      <path d="M197 226 Q200 222 203 226" fill="none" stroke="#22D3EE" stroke-width="3"/>
      <path d="M159 224 L146 220 M241 224 L254 220" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
      <!-- smile -->
      <path d="M185 255 Q200 268 215 255" fill="none" stroke="#9A3B3B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- laptop (back view) -->
    <g>
      <path d="M112 330 L288 330 L300 400 L100 400 Z" fill="#111827"/>
      <rect x="118" y="318" width="164" height="82" rx="10" fill="#1F2937" stroke="#374151" stroke-width="2"/>
      <circle cx="200" cy="360" r="15" fill="#22D3EE" opacity=".25" class="pulse"/>
      <circle cx="200" cy="360" r="8" fill="#22D3EE" class="pulse"/>
      <!-- typing hands -->
      <circle class="hand" cx="160" cy="320" r="11" fill="#F1C3A0"/>
      <circle class="hand2" cx="240" cy="320" r="11" fill="#F1C3A0"/>
    </g>
  </g>
  <rect x="1" y="1" width="398" height="398" rx="27" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
