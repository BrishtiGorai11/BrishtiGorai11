<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Brishti Gorai — Software Developer</title><desc id="desc">Animated neon developer banner with orbiting particles, glowing gradients, and a terminal panel.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="0.55" stop-color="#EEF2FF"/><stop offset="1" stop-color="#ECFEFF"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="0.52" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#6366F1" stop-opacity=".28"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#D8E1EF" stroke-opacity=".48" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="430" rx="28" fill="url(#bg)"/><rect width="1200" height="430" rx="28" fill="url(#grid)" opacity=".55"/>
<circle cx="980" cy="90" r="190" fill="url(#glow)"/><circle cx="180" cy="360" r="180" fill="url(#glow)"/>
<g fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".65"><path d="M-20 330 C190 180 270 450 480 290 S800 130 1220 250" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="12s" repeatCount="indefinite"/></path><path d="M-20 360 C210 230 330 420 520 320 S880 180 1220 300" stroke-dasharray="3 14" opacity=".6"><animate attributeName="stroke-dashoffset" from="0" to="180" dur="16s" repeatCount="indefinite"/></path></g>
<g fill="#22D3EE"><circle cx="65" cy="70" r="2.5" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="-0s" repeatCount="indefinite"/><animate attributeName="r" values="2.5;4.3;2.5" dur="3s" begin="-0s" repeatCount="indefinite"/></circle><circle cx="390" cy="55" r="2" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="-1s" repeatCount="indefinite"/><animate attributeName="r" values="2;3.8;2" dur="4s" begin="-1s" repeatCount="indefinite"/></circle><circle cx="700" cy="80" r="2.8" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="r" values="2.8;4.6;2.8" dur="3.5s" begin="-1.5s" repeatCount="indefinite"/></circle><circle cx="1120" cy="90" r="2" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="-2s" repeatCount="indefinite"/><animate attributeName="r" values="2;3.8;2" dur="4s" begin="-2s" repeatCount="indefinite"/></circle><circle cx="1080" cy="350" r="3" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="-1s" repeatCount="indefinite"/><animate attributeName="r" values="3;4.8;3" dur="3s" begin="-1s" repeatCount="indefinite"/></circle><circle cx="570" cy="375" r="2" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="4.5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="r" values="2;3.8;2" dur="4.5s" begin="-2s" repeatCount="indefinite"/></circle><circle cx="300" cy="350" r="2.5" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="r" values="2.5;4.3;2.5" dur="3.8s" begin="-0.5s" repeatCount="indefinite"/></circle><circle cx="850" cy="300" r="2" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="r" values="2;3.8;2" dur="3.2s" begin="-1.2s" repeatCount="indefinite"/></circle></g>
<g transform="translate(66 76)"><rect width="620" height="278" rx="22" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E1EF" stroke-width="1.2"/><path d="M0 54H620" stroke="#D8E1EF"/><circle cx="25" cy="27" r="5" fill="#FB7185"/><circle cx="43" cy="27" r="5" fill="#FBBF24"/><circle cx="61" cy="27" r="5" fill="#34D399"/><text x="88" y="32" font-family="monospace" font-size="13" fill="#475569">brishti@dev: ~/building-the-future</text>
<text x="28" y="94" font-family="monospace" font-size="15" fill="#34D399">$ whoami</text><text x="28" y="130" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#111827">Brishti Gorai<tspan fill="#22D3EE">.</tspan></text>
<text x="28" y="164" font-family="monospace" font-size="16" fill="#475569">Software Developer</text><text x="28" y="204" font-family="monospace" font-size="14" fill="#A78BFA">&gt; frontend × backend × curiosity</text><text x="28" y="236" font-family="monospace" font-size="13" fill="#475569">React  /  Next.js  /  Python  /  APIs  /  SQL</text>
